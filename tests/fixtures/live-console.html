<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>百度直播商品控制台 · 本地验收页面</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; background: #f4f6fa; font: 14px/1.6 "Microsoft YaHei", sans-serif; color: #26334b; }
    header { background: white; padding: 18px 32px; border-bottom: 1px solid #e7ebf2; font-size: 19px; font-weight: 700; }
    header small { font-size: 12px; color: #71809b; font-weight: 400; margin-left: 18px; }
    main { max-width: 1120px; margin: 28px auto; }
    .summary { display: flex; gap: 70px; padding: 24px; margin-bottom: 18px; background: white; border-radius: 12px; }
    .summary b { display: block; font-size: 24px; }
    .goods { background: white; border-radius: 12px; padding: 20px 24px; }
    .tabs { border-bottom: 1px solid #e7ebf2; margin-bottom: 16px; padding-bottom: 14px; }
    .tabs span:first-child { color: #315efb; border-bottom: 3px solid #315efb; padding: 14px 0; margin-right: 30px; }
    table { width: 100%; border-collapse: collapse; }
    th { color: #7e899c; font-size: 12px; text-align: left; background: #fafbfd; }
    th, td { padding: 15px 12px; border-bottom: 1px solid #edf0f6; }
    td:first-child { width: 55px; }
    .thumb { float: left; width: 52px; height: 52px; background: linear-gradient(145deg, #d3e0f2, #edf4fa); border-radius: 8px; margin-right: 12px; display: grid; place-items: center; color: #577197; font-size: 24px; }
    .price { color: #e45161; font-size: 12px; }
    .explain { border: 0; background: transparent; color: #242f40; padding: 7px 9px; cursor: pointer; }
    .explain[data-active="true"] { color: #315efb; background: #eef2ff; border-radius: 5px; }
    .danger { border: 0; color: #7e899c; background: transparent; }
    .badge { color: #e54451; display: inline-block; font-size: 11px; margin-left: 8px; }
    .ant-pagination { display: flex; justify-content: flex-end; align-items: center; gap: 14px; list-style: none; padding: 18px 0 0; }
    .ant-pagination button { padding: 5px 12px; border: 1px solid #d7dfea; background: white; border-radius: 5px; cursor: pointer; }
    button:disabled { opacity: .4; cursor: default; }
    .virtual-list { height: 540px; overflow: auto; position: relative; }
    .virtual-row { position: absolute; left: 0; right: 0; height: 90px; display: grid; grid-template-columns: 55px 1fr 120px 230px; align-items: center; padding: 12px; border-bottom: 1px solid #edf0f6; background: white; }
    .fixture-info { color: #8692a8; padding-top: 20px; font-size: 12px; }
  </style>
</head>
<body>
  <header>百度直播 · 主播工作台 <small>仅供本地功能验收，不连接真实账号，不操作直播间</small></header>
  <main>
    <section class="summary"><div>开播时长<b>00:26:25</b></div><div>实时观看人数<b>3</b></div><div>成交金额<b>¥ 0.00</b></div></section>
    <section class="goods">
      <div class="tabs"><span id="goods-tab">直播商品（72）</span><span>闪电购商品</span></div>
      <div id="catalog"></div>
      <div id="pager"></div>
    </section>
    <div class="fixture-info" id="fixture-info"></div>
  </main>
  <script>
    (() => {
      const params = new URLSearchParams(location.search);
      const state = {
        count: Number(params.get('count') || 72),
        mode: params.get('mode') || 'table',
        pageSize: Number(params.get('pageSize') || 20),
        page: 1,
        active: Number(params.get('active') || 0),
        delay: Number(params.get('delay') || 35),
        fail: new Set((params.get('fail') || '').split(',').filter(Boolean).map(Number)),
        clicks: [],
        mutations: [],
        dangerousClicks: 0,
        removed: new Set(),
      };
      const title = number => `精选商品 ${number} · 舒适透气运动鞋`;
      function productMarkup(number, virtual = false) {
        const active = state.active === number;
        const numberCell = `<${virtual ? 'div' : 'td'} class="product-number">${number}</${virtual ? 'div' : 'td'}>`;
        const productCell = `<${virtual ? 'div' : 'td'}><div class="thumb">鞋</div><span class="product-title">${title(number)}</span>${active ? '<span class="badge">▮▮ 讲解中</span>' : ''}<div class="price">¥ ${(19.9 + number).toFixed(2)}</div></${virtual ? 'div' : 'td'}>`;
        const salesCell = `<${virtual ? 'div' : 'td'}>0 / 178.83w</${virtual ? 'div' : 'td'}>`;
        const actions = `<${virtual ? 'div' : 'td'}><button type="button" class="explain" data-number="${number}" data-active="${active}">${active ? '取消讲解' : '讲解商品'}</button><button type="button" class="danger" data-danger="preview">预览</button><button type="button" class="danger" data-danger="remove">下架</button><button type="button" class="danger" data-danger="delete">删除</button></${virtual ? 'div' : 'td'}>`;
        return numberCell + productCell + salesCell + actions;
      }
      function numbers() { return Array.from({ length: state.count }, (_, i) => i + 1).filter(n => !state.removed.has(n)); }
      function renderTable() {
        const all = numbers();
        const visible = state.mode === 'paged' ? all.slice((state.page - 1) * state.pageSize, state.page * state.pageSize) : all;
        document.querySelector('#catalog').innerHTML = `<table class="ant-table"><thead><tr><th>序号</th><th>商品信息</th><th>售出/库存</th><th>操作</th></tr></thead><tbody>${visible.map(n => `<tr class="ant-table-row" data-row-key="sku-${n}" data-product-id="sku-${n}" data-number="${n}">${productMarkup(n)}</tr>`).join('')}</tbody></table>`;
        if (state.mode === 'paged') {
          const pages = Math.ceil(all.length / state.pageSize);
          document.querySelector('#pager').innerHTML = `<ul class="ant-pagination"><li title="上一页" class="ant-pagination-prev ${state.page === 1 ? 'ant-pagination-disabled' : ''}" aria-disabled="${state.page === 1}"><button type="button" aria-label="上一页" data-page="previous" ${state.page === 1 ? 'disabled' : ''}>上一页</button></li><li>${state.page} / ${pages}</li><li title="下一页" class="ant-pagination-next ${state.page >= pages ? 'ant-pagination-disabled' : ''}" aria-disabled="${state.page >= pages}"><button type="button" aria-label="下一页" data-page="next" ${state.page >= pages ? 'disabled' : ''}>下一页</button></li></ul>`;
        }
      }
      function renderVirtualRows() {
        const viewport = document.querySelector('.virtual-list');
        const all = numbers();
        const first = Math.max(0, Math.floor(viewport.scrollTop / 90) - 2);
        const visible = all.slice(first, first + 11);
        viewport.querySelector('.virtual-spacer').innerHTML = visible.map(n => `<div role="row" class="virtual-row" data-row-key="sku-${n}" data-product-id="sku-${n}" data-number="${n}" style="top:${all.indexOf(n) * 90}px">${productMarkup(n, true)}</div>`).join('');
      }
      function render() {
        document.querySelector('#goods-tab').textContent = `直播商品（${numbers().length}）`;
        if (state.mode === 'virtual') {
          const existing = document.querySelector('.virtual-list');
          if (!existing) {
            document.querySelector('#catalog').innerHTML = `<div class="virtual-list" role="table"><div class="virtual-spacer" style="height:${numbers().length * 90}px;position:relative"></div></div>`;
            document.querySelector('.virtual-list').addEventListener('scroll', renderVirtualRows);
          }
          renderVirtualRows();
        } else renderTable();
        document.querySelector('#fixture-info').textContent = `测试模式：${state.mode} · 商品：${numbers().length} · 已触发讲解：${state.clicks.length}`;
      }
      document.addEventListener('click', event => {
        const danger = event.target.closest('[data-danger]');
        if (danger) state.dangerousClicks++;
        const page = event.target.closest('[data-page]');
        if (page && !page.disabled) {
          state.page += page.dataset.page === 'next' ? 1 : -1;
          render();
        }
        const explain = event.target.closest('button.explain');
        if (!explain) return;
        const number = Number(explain.dataset.number);
        state.clicks.push({ number, at: Date.now(), previous: state.active, wasActive: state.active === number });
        if (state.fail.has(number)) return;
        setTimeout(() => {
          state.active = state.active === number ? 0 : number;
          state.mutations.push({ number, active: state.active, at: Date.now() });
          render();
        }, state.delay);
      });
      window.fixture = {
        state,
        render,
        remove(number) { state.removed.add(number); render(); },
        setActive(number) { state.active = number; render(); },
        setFailure(number, enabled = true) { enabled ? state.fail.add(number) : state.fail.delete(number); },
      };
      render();
    })();
  </script>
</body>
</html>
