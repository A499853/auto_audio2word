<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>百度直播商品讲解助手</title><link rel="stylesheet" href="popup.css"></head>
<body>
  <div class="brand"><span class="mark">讲</span><div><strong>商品自动讲解助手</strong><small>百度直播 · Chrome / Edge</small></div></div>
  <p>在直播中控台打开商品列表，用浮动面板设置讲解计划。</p>
  <button id="toggle" type="button">显示 / 隐藏操作面板</button>
  <button id="open" class="secondary" type="button">打开百度直播中控台</button>
  <p id="status" role="status" aria-live="polite">默认每 8 秒切换商品，开启后按计划执行。</p>
  <div class="footer">所有配置保存在本机 · 刷新页面后需手动开启</div>
  <script src="popup.js"></script>
</body>
</html>
